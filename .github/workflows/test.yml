name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the project actually runs on; 3.11 guards against drift.
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the suite
        # No credentials are available in CI and none are needed: every test
        # injects its broker, market-data and LLM clients, so the suite never
        # touches the network.
        run: python3 -m pytest tests/ -q --tb=short

      - name: Verify the decision journal's hash chain
        run: python3 scripts/verify_journal.py

      - name: Verify validation-artifact integrity
        run: python3 merkle.py
