<!doctype html>
<meta charset="utf-8">
<title>terminal</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden}
  body{font-family:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;color:#d7dde5}
  .bar{height:44px;background:#15181d;border-bottom:1px solid #262b33;display:flex;align-items:center;padding:0 22px;gap:10px}
  .dot{width:12px;height:12px;border-radius:50%}
  .title{margin-left:14px;font-size:15px;color:#8a94a3;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  pre{margin:0;padding:30px 40px 90px;font-size:25px;line-height:1.55;white-space:pre-wrap;word-break:break-word;height:calc(100vh - 44px);box-sizing:border-box;overflow-y:auto;scrollbar-width:none}
  pre::-webkit-scrollbar{display:none}
  .hl{color:#d0ff7e;font-weight:700}
  .cur{display:inline-block;width:13px;height:28px;background:#d7dde5;vertical-align:-4px;animation:b 1s steps(1) infinite}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:16px 40px;font-size:22px;background:#101318;border-top:1px solid #262b33;color:#e75d60;font-weight:700;opacity:0;transition:opacity .4s}
  @keyframes b{50%{opacity:0}}
</style>
<div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="title" id="t"></span></div>
<pre id="p"></pre>
<div class="foot" id="f"></div>
<script>
// Driven by Playwright: window.play({title, lines, highlight, footer, durationMs})
// Types the text so it completes at ~72% of the audio, then holds. Highlighted
// substrings light up as they appear, so a spoken number lands on screen as
// the word is said.
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function mark(line, hls){
  let h = esc(line);
  for (const k of hls || []) {
    const e = esc(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    h = h.replace(new RegExp(e, 'g'), m => `<span class="hl">${m}</span>`);
  }
  return h;
}
window.play = function(s){
  document.getElementById('t').textContent = s.title || '';
  const p = document.getElementById('p');
  const lines = s.lines;
  // Pre-render every line's highlighted HTML once; per-frame work is then a slice.
  const html = lines.map(l => mark(l, s.highlight));
  const lens = lines.map(l => l.length + 1);
  const total = lens.reduce((a,b)=>a+b, 0);
  const budget = Math.max(1200, (s.durationMs || 8000) * 0.72);
  const t0 = performance.now();
  let done = false;
  function render(nChars){
    // draw all fully-revealed lines, then a partial current line, then the cursor
    let acc = 0, out = '';
    for (let i = 0; i < lines.length; i++){
      if (acc + lens[i] <= nChars){ out += html[i] + '\n'; acc += lens[i]; continue; }
      const k = Math.max(0, nChars - acc);
      out += mark(lines[i].slice(0, k), s.highlight) + '<span class="cur"></span>';
      p.innerHTML = out; p.scrollTop = p.scrollHeight; return false;
    }
    p.innerHTML = out; p.scrollTop = p.scrollHeight; return true;
  }
  function frame(){
    const frac = Math.min(1, (performance.now() - t0) / budget);
    const finished = render(Math.floor(frac * total));
    if (finished || frac >= 1){
      render(total);
      if (s.footer){ const f=document.getElementById('f'); f.textContent = s.footer; f.style.opacity = 1; }
      done = true; return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
};
</script>
