[project]
name = "trading-alpaca"
version = "1.0.0"
description = "AI-powered trading agent for the AgenticTrade hackathon"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "requests==2.32.3",
    "alpaca-py==0.44.0",
    "py_vollib==1.0.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # websockets.legacy, pulled in transitively by alpaca-py. Not our code and
    # not actionable here; silenced so real warnings stay visible.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:py_vollib is deprecated:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
